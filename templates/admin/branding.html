{% extends "base.html" %}
{% block title %}Branding — Admin{% endblock %}
{% block content %}
<section class="page-hero"><div class="container">
  <nav class="breadcrumb"><a href="{{ url_for('admin_dashboard') }}">Admin</a> / Branding</nav>
  <h1 class="page-title">Branding &amp; Theme</h1>
</div></section>
<section class="section"><div class="container container-md">
<form method="POST" class="admin-form">
  <div class="admin-form-section">
    <h3 class="afs-title">Identity</h3>
    <div class="form-group">
      <label class="form-label">Site Name</label>
      <input type="text" name="site_name" class="form-input" value="{{ branding.site_name }}" required />
    </div>
    <div class="form-group">
      <label class="form-label">Footer Text</label>
      <input type="text" name="footer_text" class="form-input" value="{{ branding.footer_text }}" />
    </div>
  </div>
  <div class="admin-form-section">
    <h3 class="afs-title">Logo &amp; Favicon</h3>
    <div class="form-group">
      <label class="form-label">Logo URL</label>
      <input type="url" name="logo_url" class="form-input" value="{{ branding.logo_url }}" placeholder="https://..." id="logoUrlInput" />
      <div class="url-preview" id="logoPreview"><img src="{{ branding.logo_url }}" alt="Logo preview" onerror="this.style.display='none'" /></div>
    </div>
    <div class="form-group">
      <label class="form-label">Favicon URL</label>
      <input type="url" name="favicon_url" class="form-input" value="{{ branding.favicon_url }}" placeholder="https://..." id="faviconUrlInput" />
      <div class="url-preview" id="faviconPreview"><img src="{{ branding.favicon_url }}" alt="Favicon preview" style="width:32px;height:32px" onerror="this.style.display='none'" /></div>
    </div>
  </div>
  <div class="admin-form-section">
    <h3 class="afs-title">Colors</h3>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Primary Color</label>
        <div class="color-input-wrap">
          <input type="color" name="primary_color" class="color-picker" value="{{ branding.primary_color }}" id="primaryColor" />
          <input type="text" class="form-input color-hex" value="{{ branding.primary_color }}" id="primaryHex" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Secondary Color</label>
        <div class="color-input-wrap">
          <input type="color" name="secondary_color" class="color-picker" value="{{ branding.secondary_color }}" id="secondaryColor" />
          <input type="text" class="form-input color-hex" value="{{ branding.secondary_color }}" id="secondaryHex" />
        </div>
      </div>
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save Branding</button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
</div></section>
{% endblock %}
{% block scripts %}
<script>
['primary','secondary'].forEach(id=>{
  const picker=document.getElementById(id+'Color');
  const hex=document.getElementById(id+'Hex');
  picker.addEventListener('input',()=>{hex.value=picker.value});
  hex.addEventListener('input',()=>{if(/^#[0-9a-f]{6}$/i.test(hex.value))picker.value=hex.value});
});
['logo','favicon'].forEach(id=>{
  const input=document.getElementById(id+'UrlInput');
  const prev=document.getElementById(id+'Preview').querySelector('img');
  input.addEventListener('input',()=>{prev.src=input.value;prev.style.display='';});
});
</script>
{% endblock %}
