{% extends "base.html" %}
{% block title %}Login — {{ branding.site_name }}{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ branding.logo_url }}" alt="{{ branding.site_name }}" onerror="this.style.display='none'" />
      <h1 class="auth-title">{{ branding.site_name }}</h1>
    </div>
    <h2 class="auth-heading">Sign in to your account</h2>
    <p class="auth-sub">Welcome back — enter your credentials to continue.</p>

    <form method="POST" class="auth-form">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com"
               required value="{{ request.form.email or '' }}" autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input type="password" name="password" id="pwInput" class="form-input"
                 placeholder="Your password" required autocomplete="current-password" />
          <button type="button" class="pw-toggle" onclick="togglePw()">
            <svg id="eyeShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeHide" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Sign in</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePw(){
  const i=document.getElementById('pwInput');
  const show=document.getElementById('eyeShow');
  const hide=document.getElementById('eyeHide');
  if(i.type==='password'){i.type='text';show.style.display='none';hide.style.display=''}
  else{i.type='password';show.style.display='';hide.style.display='none'}
}
</script>
{% endblock %}
